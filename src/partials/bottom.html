<!-- Shared bottom of every page: footer and the phone booking bar. -->
  <footer class="site-footer" data-tone="dark">
    <div class="wrap footer-inner">
      <p class="footer-mark" aria-hidden="true"><span class="foil foil-light">BE BEAUTY</span></p>
      <p class="footer-tagline">Beauty. Balance. <em>Glow.</em></p>
      <p class="footer-sub" data-i18n="footer.sub"></p>
      <nav class="footer-nav" data-i18n-attr="aria-label:ui.menu">
        <a href="{{root}}" data-nav data-i18n="nav.home"></a>
        <a href="{{root}}behandlingar/" data-nav data-i18n="nav.treatments"></a>
        <a href="{{root}}om/" data-nav data-i18n="nav.about"></a>
        <a href="{{root}}akademi/" data-nav data-i18n="nav.academy"></a>
        <a href="{{root}}kontakt/" data-nav data-i18n="nav.contact"></a>
      </nav>
      <p class="footer-links">
        <a data-link="instagram" href="#" target="_blank" rel="noopener"><span class="ig-icon"></span><span data-contact="instagram"></span></a>
        <a data-link="facebook" href="#" target="_blank" rel="noopener"><span class="fb-icon"></span><span data-contact="facebook"></span></a>
        <a data-link="mailto" href="#" data-contact="email"></a>
      </p>
      <p class="footer-small">© <span data-year></span> BE BEAUTY. <span data-i18n="footer.rights"></span> <a href="#top" data-i18n="footer.top"></a></p>
    </div>
  </footer>

  <!-- Thumb-zone booking bar on phones. -->
  <div class="book-bar" data-book-bar>
    <p class="book-bar-rating"><span class="star" aria-hidden="true">★</span><span data-i18n="ui.barRating"></span></p>
    <a class="btn btn-solid btn-small" data-link="book" href="#" target="_blank" rel="noopener" data-i18n="ui.book"></a>
  </div>

  <!-- Floating social gems; they arrive once the visitor starts scrolling (src/main.js). -->
  <nav class="socials" data-socials data-i18n-attr="aria-label:ui.socials">
    <a class="social" data-link="instagram" href="#" target="_blank" rel="noopener" data-i18n-attr="aria-label:ui.instagram"><span class="ig-icon"></span></a>
    <a class="social" data-link="facebook" href="#" target="_blank" rel="noopener" data-i18n-attr="aria-label:ui.facebook"><span class="fb-icon"></span></a>
  </nav>

  <!-- Tapping a gem first asks before leaving for Instagram or Facebook, so a stray tap does nothing. -->
  <dialog class="leave" data-leave aria-labelledby="leave-title" aria-describedby="leave-text">
    <form class="leave-card" method="dialog">
      <span class="leave-gem" data-leave-icon aria-hidden="true"></span>
      <p class="leave-title" id="leave-title" data-leave-title></p>
      <p class="leave-text" id="leave-text" data-leave-text></p>
      <div class="leave-actions">
        <button class="leave-cancel" value="cancel" data-i18n="ui.leave.cancel"></button>
        <a class="leave-go" data-leave-go href="#" target="_blank" rel="noopener" data-i18n="ui.leave.go"></a>
      </div>
    </form>
  </dialog>

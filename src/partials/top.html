<!-- Shared top of every page: skip link, first-visit portal, header, phone menu and page curtain. -->
  <a class="skip-link" href="#main" data-i18n="ui.skip"></a>

  <!-- The first visits: the quartz ritual (src/portal.js), in three steps round
       the rose-quartz stone of the 3D world, engraved with the house's name:
       sound on or off, the language (chosen for the visitor after a countdown),
       then the stone itself, touched to enter. It only shows while the head
       script's .portal-open is set, so without JavaScript the site opens directly. -->
  <div class="portal" data-portal data-step="sound" role="dialog" aria-modal="true" aria-labelledby="portal-sound-title" tabindex="-1">
    <button type="button" class="ritual-stone" data-portal-stone data-portal-label="enter" tabindex="-1" aria-hidden="true">
      <span class="ritual-halo" aria-hidden="true"></span>
      <svg class="ritual-ring" viewBox="0 0 100 100" focusable="false" aria-hidden="true">
        <circle class="ritual-ring-track" cx="50" cy="50" r="48.5"/>
        <circle class="ritual-ring-fill" cx="50" cy="50" r="48.5" pathLength="1"/>
      </svg>
      <span class="ritual-ripples" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="ritual-gem" aria-hidden="true">
        <span class="ritual-plate"><span class="ritual-plate-name">BE <em>BEAUTY</em></span><span data-portal-text="eyebrow"></span></span>
      </span>
    </button>

    <div class="ritual-step" data-step-panel="sound">
      <h2 class="ritual-ask" id="portal-sound-title" data-portal-text="soundTitle"></h2>
      <p class="ritual-hint" data-portal-text="soundLead"></p>
      <div class="ritual-sound">
        <button type="button" class="ritual-yes" data-sound="on">
          <span class="ritual-yes-label"><svg class="ritual-sound-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 9.25h3.4L11.6 5.3v13.4l-4.7-3.95H3.5z"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/><path d="M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg><span data-portal-text="yes"></span></span>
          <span class="ritual-yes-tag" data-portal-text="recommended"></span>
        </button>
        <button type="button" class="ritual-no" data-sound="off" data-portal-text="no"></button>
      </div>
    </div>

    <div class="ritual-step" data-step-panel="lang" hidden>
      <h2 class="ritual-ask" id="portal-lang-title" data-portal-text="langTitle"></h2>
      <div class="ritual-langs">
        <button type="button" class="ritual-lang" data-pick="sv" lang="sv"><span class="ritual-lang-fill" aria-hidden="true"></span><span class="ritual-lang-name">Svenska</span></button>
        <button type="button" class="ritual-lang" data-pick="en" lang="en"><span class="ritual-lang-fill" aria-hidden="true"></span><span class="ritual-lang-name">English</span></button>
      </div>
      <div class="ritual-countdown">
        <span class="ritual-clock" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16"/><circle class="ritual-clock-fill" cx="18" cy="18" r="16" pathLength="1"/></svg><span data-countdown-n>5</span></span>
        <span class="ritual-countdown-label" role="status" data-countdown-label></span>
        <button type="button" class="ritual-countdown-toggle" aria-pressed="false" data-countdown-toggle></button>
      </div>
    </div>

    <div class="ritual-step" data-step-panel="stone" hidden>
      <p class="ritual-touch" data-portal-text="touch" aria-hidden="true"></p>
      <h2 class="ritual-title" id="portal-stone-title" data-portal-html="title"></h2>
      <p class="ritual-award">
        <span class="ritual-wreath" aria-hidden="true"><svg class="award-laurel" data-laurel viewBox="0 0 320 200" focusable="false"></svg><span>2026</span></span>
        <span class="ritual-award-text"><em data-portal-text="award"></em><span data-portal-text="awardKicker"></span></span>
      </p>
    </div>
  </div>

  <!-- A couture masthead: the foil wordmark in the middle, the menu and sound on
       its left, the language (and on wider screens the booking button) on its
       right; on desktop the pages sit on a second row underneath. -->
  <header class="site-header" data-header>
    <div class="header-inner">
      <div class="header-start">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" data-menu-toggle>
          <span class="visually-hidden" data-i18n="ui.menu"></span>
          <span class="menu-toggle-lines" aria-hidden="true"></span>
        </button>
        <button type="button" class="sound-toggle" data-sound-toggle aria-pressed="false" data-i18n-attr="aria-label:ui.sound"><span class="satin" aria-hidden="true"></span><svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="sound-speaker" d="M3.5 9.25h3.4L11.6 5.3v13.4l-4.7-3.95H3.5z"/><path class="sound-wave" d="M15 9.2a4 4 0 0 1 0 5.6"/><path class="sound-wave" d="M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="sound-slash" d="M4 4.5l15.5 15"/></svg></button>
      </div>
      <a class="wordmark" href="{{root}}" data-nav>
        <span class="foil">BE <em>BEAUTY</em></span>
        <span class="wordmark-tagline">Salon &amp; Academy</span>
      </a>
      <div class="header-end">
        <div class="lang-switch" role="group" data-i18n-attr="aria-label:ui.langLabel">
          <span class="satin" aria-hidden="true"></span>
          <span class="lang-thumb" aria-hidden="true"></span>
          <button type="button" data-lang="sv" aria-pressed="true">SV</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="btn btn-solid btn-small header-book" data-link="book" href="#" target="_blank" rel="noopener" data-i18n="ui.book"></a>
      </div>
      <nav class="nav" data-i18n-attr="aria-label:ui.menu">
        <ul>
          <li><a href="{{root}}#metoden" data-nav data-i18n="nav.method"></a></li>
          <li><a href="{{root}}behandlingar/" data-nav data-i18n="nav.treatments"></a></li>
          <li><a href="{{root}}om/" data-nav data-i18n="nav.about"></a></li>
          <li><a href="{{root}}akademi/" data-nav data-i18n="nav.academy"></a></li>
          <li><a href="{{root}}kontakt/" data-nav data-i18n="nav.contact"></a></li>
        </ul>
      </nav>
    </div>
    <span class="header-rule" aria-hidden="true"></span>
  </header>

        <li><a href="{{root}}" data-nav><span class="mobile-nav-num">01</span><span data-i18n="nav.home"></span></a></li>
        <li><a href="{{root}}behandlingar/" data-nav><span class="mobile-nav-num">02</span><span data-i18n="nav.treatments"></span></a></li>

        <a data-link="mailto" href="#" data-contact="email"></a>

  <!-- Between pages: a satin curtain sweeps up, the next page loads behind it (src/router.js). -->
  <div class="curtain" data-curtain aria-hidden="true">
    <svg class="curtain-shape" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
      <defs>
        <linearGradient id="curtain-satin" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2b161d"/><stop offset="0.55" stop-color="#5e2a36"/><stop offset="1" stop-color="#8e4651"/>
        </linearGradient>
      </defs>
      <path data-curtain-path fill="url(#curtain-satin)" d="M0 100 Q50 100 100 100 L100 100 Q50 100 0 100 Z"/>
    </svg>
    <p class="curtain-title" data-curtain-title></p>
  </div>

<!doctype html>
<!-- About Bella. Text is filled from src/content.js like the home page (see index.html). -->
<html lang="sv">
<head>
<!-- @include head -->
  <title data-i18n="pages.about.title"></title>
  <meta name="description" content="" data-i18n-attr="content:pages.about.description">
</head>
<body>
<!-- @include top -->

  <main id="main" data-page="about">
    <section class="page-hero" id="top" data-tone="light" aria-labelledby="page-title">
      <div class="wrap page-hero-grid">
        <div class="page-hero-copy">
          <p class="section-label" data-reveal data-i18n="pages.about.label"></p>
          <h1 class="page-title" id="page-title" data-reveal data-i18n="about.title"></h1>
          <p class="page-roles" data-reveal data-i18n="about.roles"></p>
          <p class="page-lead" data-reveal data-i18n="about.lead"></p>
        </div>
        <div class="page-hero-side">
          <figure class="page-hero-media" data-reveal-image data-gl-media data-gl-alive>
            <img data-parallax src="../src/images/bella-studio.jpg" width="1051" height="1130" alt="" data-i18n-attr="alt:about.imageAlt">
          </figure>
          <span class="stone-rest" data-stone-rest aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <!-- Best Beauty Salon 2026 -->
    <section class="award-feature section" data-tone="dark" aria-labelledby="award-title">
      <div class="wrap award-inner">
        <p class="section-label" data-reveal data-i18n="pages.about.awardLabel"></p>
        <div class="award-seal" data-reveal>
          <svg class="award-laurel" data-laurel viewBox="0 0 320 200" focusable="false" aria-hidden="true"></svg>
          <span class="award-year">2026</span>
        </div>
        <p class="award-kicker" data-reveal data-i18n="premiere.awardKicker"></p>
        <h2 class="award-title" id="award-title" data-reveal data-i18n="premiere.award"></h2>
        <p class="award-text" data-reveal data-i18n="pages.about.awardText"></p>
        <figure class="award-quote" data-reveal>
          <blockquote><p data-i18n="premiere.awardQuote"></p></blockquote>
          <figcaption data-i18n="pages.about.awardBy"></figcaption>
        </figure>
      </div>
    </section>

    <!-- Her story -->
    <section class="story section" data-tone="light" aria-labelledby="story-title">
      <div class="wrap story-grid">
        <div>
          <p class="section-label" data-reveal data-i18n="pages.about.storyLabel"></p>
          <h2 class="section-title" id="story-title" data-reveal data-i18n="pages.about.storyTitle"></h2>
        </div>
        <div class="story-copy">
          <p data-reveal data-i18n="about.body1"></p>
          <p data-reveal data-i18n="about.body2"></p>
          <p class="team" data-reveal data-i18n="about.team"></p>
        </div>
      </div>
      <figure class="about-quote wrap">
        <blockquote><p data-scrub-words data-i18n="about.quote"></p></blockquote>
        <figcaption data-i18n="about.quoteBy"></figcaption>
      </figure>
    </section>

    <!-- Awards, roles and education -->
    <section class="section" data-tone="rose" aria-labelledby="awards-title">
      <div class="wrap about-lists">
        <figure class="about-jury" data-reveal-image data-gl-media data-gl-alive>
          <img data-parallax src="../src/images/jury-asia.jpg" width="1120" height="1400" loading="lazy" alt="" data-i18n-attr="alt:about.juryAlt">
        </figure>
        <div class="awards">
          <h2 class="list-title" id="awards-title" data-reveal data-i18n="about.awardsTitle"></h2>
          <ol class="timeline" data-timeline>
            <li><span class="t-year">2026</span><span data-i18n="pages.about.awardLine"></span></li>
            <li><span class="t-year">2026</span><span data-i18n="about.awards.0"></span></li>
            <li><span class="t-year">2026</span><span data-i18n="about.awards.1"></span></li>
            <li><span class="t-year">2026</span><span data-i18n="about.awards.2"></span></li>
            <li><span class="t-year">2025</span><span data-i18n="about.awards.3"></span></li>
            <li><span class="t-year">2025</span><span data-i18n="about.awards.4"></span></li>
            <li><span class="t-year">2025</span><span data-i18n="about.awards.5"></span></li>
            <li><span class="t-year">2024</span><span data-i18n="about.awards.6"></span></li>
          </ol>
        </div>
        <div class="education">
          <h2 class="list-title" data-reveal data-i18n="about.educationTitle"></h2>
          <ul class="edu-list">
            <li data-reveal data-i18n="about.education.0"></li>
            <li data-reveal data-i18n="about.education.1"></li>
            <li data-reveal data-i18n="about.education.2"></li>
            <li data-reveal data-i18n="about.education.3"></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Gallery: championships, press and the studio -->
    <section class="gallery section" data-tone="light" aria-labelledby="gallery-title">
      <div class="wrap">
        <p class="section-label" data-reveal data-i18n="pages.about.galleryLabel"></p>
        <h2 class="section-title" id="gallery-title" data-reveal data-i18n="pages.about.galleryTitle"></h2>
      </div>
      <div class="wrap gallery-grid">
        <figure class="gallery-item gallery-wide" data-reveal-image data-gl-media data-gl-alive>
          <img data-parallax src="../src/images/paris-championship.jpg" width="1000" height="959" loading="lazy" alt="" data-i18n-attr="alt:proof.parisAlt">
        </figure>
        <div class="gallery-press">
          <figure class="gallery-item gallery-cover" data-reveal-image data-gl-media data-gl-alive>
            <img src="../src/images/hudterapeuten.jpg" width="573" height="809" loading="lazy" alt="" data-i18n-attr="alt:proof.pressAlt">
          </figure>
          <p class="gallery-caption" data-reveal data-i18n="proof.press"></p>
        </div>
        <figure class="gallery-item" data-reveal-image data-gl-media data-gl-alive>
          <img data-parallax src="../src/images/studio.jpg" width="1179" height="1150" loading="lazy" alt="" data-i18n-attr="alt:studios.photoAlt">
        </figure>
        <figure class="gallery-item" data-reveal-image data-gl-media data-gl-alive>
          <img data-parallax src="../src/images/guasha.jpg" width="1179" height="1291" loading="lazy" alt="" data-i18n-attr="alt:approach.items.1.imageAlt">
        </figure>
      </div>
    </section>

    <section class="page-cta section" data-tone="dark" aria-labelledby="cta-title">
      <div class="wrap page-cta-inner">
        <h2 class="page-cta-title" id="cta-title" data-reveal data-i18n="pages.about.ctaTitle"></h2>
        <p class="page-cta-text" data-reveal data-i18n="pages.about.ctaText"></p>
        <div class="page-cta-actions" data-reveal>
          <a class="btn btn-cream" data-link="book" href="#" target="_blank" rel="noopener" data-i18n="ui.bookFull"></a>
          <a class="btn btn-ghost" href="../behandlingar/" data-nav data-i18n="pages.common.seeTreatments"></a>
        </div>
      </div>
    </section>
  </main>

<!-- @include bottom -->
</body>
</html>

<!-- Shared <head> for every page; {{root}} is the path back to the site root. -->

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6E9E4">
  <link rel="icon" href="{{root}}favicon-brand-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{root}}apple-touch-icon-brand.png" sizes="180x180">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BE BEAUTY">
  <meta property="og:image" content="https://bellabayar.com/social-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap">
  <script>
    // Hide reveal targets until the motion script runs; show them anyway if it never does.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion');
      setTimeout(() => document.documentElement.classList.contains('motion-ready') || document.documentElement.classList.remove('motion'), 3000);
    }
    // The first three visits (or ?intro): open the ritual before anything else paints.
    try {
      if ((parseInt(localStorage.getItem('bebeauty-entered'), 10) || 0) < 3 || /[?&]intro\b/.test(location.search)) document.documentElement.classList.add('portal-open');
    } catch {
      document.documentElement.classList.add('portal-open');
    }
  </script>
  <link rel="stylesheet" href="{{root}}src/styles.css">
  <script type="module" src="{{root}}src/main.js"></script>
